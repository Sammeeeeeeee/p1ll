[versions]
agp = "8.13.2"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"
composeBom = "2026.03.00"
coreKtx = "1.17.0"
activityCompose = "1.12.4"
lifecycle = "2.10.0"
room = "2.8.4"
datastore = "1.2.1"
coroutines = "1.10.2"
junit = "4.13.2"
