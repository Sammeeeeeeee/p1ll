name: Release

# Push a tag like v1.2.0 (or publish a release for one) and this builds, signs with the
# committed keystore, and attaches the APK to that tag's GitHub release.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build signed APK
        run: |
          echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          VERSION_NAME="${TAG#v}" ./gradlew testDebugUnitTest assembleRelease --stacktrace
      - name: Verify signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "p1ll-${VERSION_NAME}.apk"
      - name: Publish
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "p1ll-${VERSION_NAME}.apk" --clobber
          else
            gh release create "$TAG" "p1ll-${VERSION_NAME}.apk" --title "p1ll ${VERSION_NAME}" --generate-notes
          fi
